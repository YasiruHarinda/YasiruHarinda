<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Yasiru Edirimanna">
  <style>
    .name { font-family: "Arial Black", "Segoe UI Black", "Helvetica Neue", Arial, sans-serif; font-weight: 900; letter-spacing: -2px; }
    .first { fill: #f4f4f5; font-size: 92px; }
    .last { fill: none; stroke: #c6f24e; stroke-width: 2.2px; font-size: 92px; }
    .rise { opacity: 0; animation: rise 0.9s cubic-bezier(.22,1,.36,1) forwards; }
    .d2 { animation-delay: 0.25s; }
    .dot { fill: #c6f24e; opacity: 0; animation: fade 0.6s ease forwards 0.9s; }
    @keyframes rise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .rise, .dot { animation: none; opacity: 1; } }
  </style>
  <text class="name first rise" x="450" y="102" text-anchor="middle">YASIRU</text>
  <text class="name last rise d2" x="450" y="200" text-anchor="middle">EDIRIMANNA</text>
  <circle class="dot" cx="796" cy="191" r="9" />
</svg>
